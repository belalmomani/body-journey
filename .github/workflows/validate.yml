name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Locate Godot project
        id: p
        run: |
          f=$(find . -name project.godot -not -path "./.godot/*" | head -1)
          if [ -z "$f" ]; then echo "project.godot not found in repository"; ls -la; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Import project
        run: godot --headless --path "${{ steps.p.outputs.dir }}" --import || true
      - name: Run tests
        run: |
          godot --headless --path "${{ steps.p.outputs.dir }}" -s res://tests/run_tests.gd 2>&1 | tee test.log
          if grep -E "SCRIPT ERROR|Parse Error|FAIL " test.log; then echo "Errors found"; exit 1; fi
