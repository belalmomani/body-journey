name: android-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Locate Godot project
        id: p
        run: |
          f=$(find . -name project.godot -not -path "./.godot/*" | head -1)
          if [ -z "$f" ]; then echo "project.godot not found"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Setup Godot (templates + Android settings)
        run: |
          V="${GODOT_VERSION:-4.3}"
          mkdir -p ~/.config/godot ~/.local/share/godot/export_templates
          cp -r /root/.config/godot/. ~/.config/godot/ 2>/dev/null || true
          mv /root/.local/share/godot/export_templates/${V}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls ~/.local/share/godot/export_templates ~/.config/godot || true
          ls /root/debug.keystore || echo "NO debug.keystore in image"
          echo "--- templates"; ls -la ~/.local/share/godot/export_templates/${V}.stable | head -40; cat ~/.local/share/godot/export_templates/${V}.stable/version.txt || echo "NO version.txt"
          ls ~/.local/share/godot/export_templates/${V}.stable/android* 2>/dev/null || echo "NO android templates found"
          grep -i "android\|java" ~/.config/godot/editor_settings-4.3.tres || echo "no android keys in editor settings"
          ls /usr/lib/android-sdk /usr/lib/android-sdk/build-tools 2>/dev/null || true
      - name: Install Android build-tools 34
        run: |
          SDK=/usr/lib/android-sdk
          SM=$(find / -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root=$SDK "cmdline-tools;latest" "build-tools;34.0.0" "platforms;android-34" || true
          fi
          if [ ! -d "$SDK/cmdline-tools/latest" ] && [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
            ln -sfn "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "--- sdk layout"; ls $SDK/cmdline-tools $SDK/build-tools $SDK/platforms $SDK/platform-tools | head -40
          echo "--- java"; ls /usr/lib/jvm || true
          JB=$(which javac || which java || true); echo "java bin: $JB"
          if [ -n "$JB" ]; then
            JH=$(dirname "$(dirname "$(readlink -f "$JB")")")
            echo "JAVA_HOME guess: $JH"
            sed -i "s|export/android/java_sdk_path = \".*\"|export/android/java_sdk_path = \"$JH\"|" ~/.config/godot/editor_settings-4.3.tres
          fi
          grep "export/android" ~/.config/godot/editor_settings-4.3.tres
      - name: Create export preset
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          cat > export_presets.cfg <<'EOF2'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="data/*,config/*.json"
          exclude_filter="tests/*,docs/*,firebase/*,.github/*"
          export_path="build/android/body-journey-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.belalmomani.bodyjourney"
          package/name="Body Journey"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/internet=true
          keystore/debug="/root/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF2
      - name: Import project
        working-directory: ${{ steps.p.outputs.dir }}
        run: godot --headless --import || true
      - name: Export debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/body-journey-debug.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: body-journey-debug-apk
          path: "**/build/android/*.apk"
